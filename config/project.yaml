project:
  name: NeuroBot
  mode: replay
  seed: 42

data:
  dataset: eegbci
  root: data/raw
  subjects: [1]
  runs: [6, 10, 14]
  # Verified from S001R06/R10/R14 annotations; MNE numeric IDs are resolved at runtime.
  event_mapping:
    T1: imagined_hands
    T2: imagined_feet

preprocessing:
  notch_hz: null
  bandpass_hz: [8, 30]
  epoch_tmin: 1.0
  epoch_tmax: 4.0

model:
  baseline: csp_lda
  stable_windows: 3
  confidence:
    mode: decision_score_margin
    enabled: false
    threshold: 0.0

control:
  default_command: HOLD
  command_timeout_ms: 500
  simulation_enabled: false
